name = "sa-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2024-04-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "sa-db"
database_id = "7f4ac224-bc8c-4a85-b870-785ba839e6d2"

[env.dev]
name = "sa-backend-dev"

[env.dev.vars]
SESSION_SECRET = "dev_secret_key_123"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "sa-db-dev"
database_id = "c610350b-c14a-49a1-b9b3-01a1a6b925a6"

