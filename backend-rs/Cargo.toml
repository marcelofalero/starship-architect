[package]
name = "backend-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
console_error_panic_hook = "0.1"
hmac = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
uuid = { version = "1.11", features = ["v4", "fast-rng", "macro-diagnostics", "js"] }
worker = { version = "0.8.3", features = ["d1", "http"] }

[lib]
crate-type = ["cdylib", "rlib"]

