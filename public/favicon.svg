<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b26" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fa3b5" />
      <stop offset="100%" stop-color="#516273" />
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="100%" stop-color="#ff3700" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded background container -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  
  <!-- Gear & Star Group -->
  <g transform="translate(256, 256)">
    <!-- Gear teeth -->
    <g fill="url(#gear-grad)">
      <rect x="-35" y="-180" width="70" height="360" rx="15" />
      <rect x="-35" y="-180" width="70" height="360" rx="15" transform="rotate(30)" />
      <rect x="-35" y="-180" width="70" height="360" rx="15" transform="rotate(60)" />
      <rect x="-35" y="-180" width="70" height="360" rx="15" transform="rotate(90)" />
      <rect x="-35" y="-180" width="70" height="360" rx="15" transform="rotate(120)" />
      <rect x="-35" y="-180" width="70" height="360" rx="15" transform="rotate(150)" />
    </g>
    
    <!-- Outer Gear Circle -->
    <circle r="145" fill="url(#gear-grad)" />
    
    <!-- Cutout hole -->
    <circle r="95" fill="#0a0d14" />
    
    <!-- 4-pointed Star -->
    <path d="M 0,-78 Q 0,0 78,0 Q 0,0 0,78 Q 0,0 -78,0 Q 0,0 0,-78 Z" fill="url(#star-grad)" filter="url(#glow)" />
    
    <!-- Core white highlight -->
    <circle r="10" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
