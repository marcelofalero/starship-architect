openapi: 3.0.0
info:
  title: SWSE Architect API
  description: API for managing Verge Map sessions and real-time synchronization.
  version: 2.0.0
servers:
  - url: http://localhost:8787
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SessionTokens:
      type: object
      properties:
        gm:
          type: string
          description: JWT token for Game Master (full read/write access)
        player:
          type: string
          description: JWT token for Navigator (read-only in this backend version, but role-identified)
        viewer:
          type: string
          description: JWT token for Viewer/Observer (read-only access)

    CreateSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tokens:
          $ref: '#/components/schemas/SessionTokens'

paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /sessions:
    post:
      summary: Create a Map Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Optional explicit UUID to suggest
                name:
                  type: string
                  description: Session name
                data:
                  type: object
                  description: Session JSON data containing ships, stars, and logs
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'

  /sessions/{sessionID}:
    get:
      summary: Get Session Data
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionID
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Session data returned
        '401':
          description: Missing or invalid authorization token
        '404':
          description: Session not found

    put:
      summary: Update Session Data
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionID
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                name:
                  type: string
                visibility:
                  type: string
                data:
                  type: object
                  description: Updated session JSON data
      responses:
        '200':
          description: Session updated successfully
        '401':
          description: Missing, invalid, or insufficient authorization token (must be GM)
        '404':
          description: Session not found
