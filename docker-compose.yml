services:
  backend:
    build:
      context: .
      dockerfile: backend-rs/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - wrangler-state:/app/backend-rs/.wrangler
    environment:
      - GOOGLE_CLIENT_ID=dev-mock-client-id
      - SESSION_SECRET=dev-mock-secret
      - WRANGLER_LOG=info
      - WRANGLER_SEND_METRICS=false

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  mqtt:
    image: eclipse-mosquitto:latest
    ports:
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  tests:
    build:
      context: tests
      dockerfile: Dockerfile
    profiles:
      - test
    depends_on:
      - backend
      - frontend
    environment:
      - BASE_URL=http://backend:8787
      - HEADLESS=false
    command: sh -c "python wait_for_api.py && pytest --base-url http://frontend"

  swagger:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  taiga-mcp:
    image: node:alpine
    working_dir: /app
    ports:
      - "4242:4242"
    environment:
      - TAIGA_URL=${TAIGA_URL}
      - TAIGA_USERNAME=${TAIGA_USERNAME}
      - TAIGA_PASSWORD=${TAIGA_PASSWORD}
    command: >
      sh -c "apk add --no-cache git &&
             git clone https://github.com/illodev/taiga-mcp.git /tmp/taiga-mcp &&
             cp -r /tmp/taiga-mcp/* /app/ &&
             cp /tmp/taiga-mcp/.npmrc /app/ 2>/dev/null || true &&
             rm -rf /tmp/taiga-mcp &&
             npm install &&
             sed -i '/registerWikiTools/d; /registerMembershipTools/d; /registerRoleTools/d; /registerUserTools/d; /registerStatusTools/d; /registerCustomAttributeTools/d; /registerHistoryTools/d; /registerTimelineTools/d; /registerResolverTools/d; /registerWebhookTools/d; /registerExportImportTools/d; /registerProjectTools/d; /registerMilestoneTools/d; /registerSearchTools/d' src/index.ts &&
             npm run build &&
             tail -f /dev/null"
    restart: unless-stopped

volumes:
  wrangler-state:

