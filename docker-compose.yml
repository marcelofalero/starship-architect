services:
  backend:
    build:
      context: .
      dockerfile: backend-rs/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - wrangler-state:/app/backend-rs/.wrangler
    environment:
      - GOOGLE_CLIENT_ID=dev-mock-client-id
      - SESSION_SECRET=dev-mock-secret
      - WRANGLER_LOG=info
      - WRANGLER_SEND_METRICS=false

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  mqtt:
    image: eclipse-mosquitto:latest
    ports:
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  hexmap-worker:
    build:
      context: .
      dockerfile: hexmap-worker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8788:8788"
    volumes:
      - ./hexmap-worker:/app
    environment:
      - WRANGLER_LOG=info
      - WRANGLER_SEND_METRICS=false
      - HOME=/tmp
      - CARGO_HOME=/tmp/.cargo

  tests:
    build:
      context: tests
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - test
    depends_on:
      - backend
      - frontend
      - hexmap-worker
    environment:
      - BASE_URL=http://backend:8787
      - HEXMAP_URL=http://hexmap-worker:8788
      - HEADLESS=false
      - HOME=/tmp
    volumes:
      - ./public:/public
      - ./tests:/app
      - ./hexmap-worker:/hexmap-worker
      - ./hexmap-worker:/app/hexmap-worker
    command: sh -c "python wait_for_api.py && pytest --base-url http://frontend"

  swagger:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro

volumes:
  wrangler-state:
  hexmap-wrangler-state:

